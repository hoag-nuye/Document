server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mcp_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

grpc:
  server:
    port: 9090

logging:
  level:
    org.springframework: INFO
    com.yourorg.mcp: DEBUG 