syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.yourorg.mcp.proto";

package mcp;

// MCP Service definition
service MCPService {
  // Execute a tool
  rpc ExecuteTool (ToolRequest) returns (ToolResponse) {}
  
  // Get available tools
  rpc GetTools (GetToolsRequest) returns (GetToolsResponse) {}
  
  // Add a new tool
  rpc AddTool (AddToolRequest) returns (AddToolResponse) {}
}

// Tool execution request
message ToolRequest {
  string tool_name = 1;
  string parameters = 2;
}

// Tool execution response
message ToolResponse {
  bool success = 1;
  string result = 2;
  string error = 3;
}

// Get tools request
message GetToolsRequest {
  // Empty request
}

// Get tools response
message GetToolsResponse {
  repeated Tool tools = 1;
}

// Add tool request
message AddToolRequest {
  Tool tool = 1;
}

// Add tool response
message AddToolResponse {
  bool success = 1;
  string error = 2;
}

// Tool definition
message Tool {
  string name = 1;
  string description = 2;
  string endpoint = 3;
  string method = 4;
  string parameters = 5;
} 